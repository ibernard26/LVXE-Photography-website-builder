# Builds the Astro site and publishes it to GitHub Pages on every push to main.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
# Custom domain (optional): Settings → Pages → Custom domain; the next run
#   builds for that domain automatically.
# Optional: Settings → Secrets and variables → Actions → Variables →
#   PUBLIC_BOOKING_ENDPOINT = the form provider URL (empty keeps the form's
#   "not connected yet" notice).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Reports the live address: the free github.io URL with its sub-path, or
      # the custom domain at the root once one is set in Settings → Pages.
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npx astro check
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PUBLIC_BOOKING_ENDPOINT: ${{ vars.PUBLIC_BOOKING_ENDPOINT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
